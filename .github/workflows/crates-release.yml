name: Crates.io Release

on:
  push:
    tags:
      - 'rustoku-lib-v*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish workspace crates
        run: |
          publish_crate() {
            local crate="$1"
            local ver=$(cargo metadata --format-version 1 --no-deps | jq -r ".packages[] | select(.name == \"$crate\") | .version")
            echo "Checking crates.io status for $crate v$ver..."
            local remote_ver=$(curl -s -H "User-Agent: rustoku-ci (samhuang91@gmail.com)" "https://crates.io/api/v1/crates/$crate/$ver" | jq -r '.version.num // empty')

            if [ "$remote_ver" = "$ver" ]; then
              echo "::notice::$crate v$ver is already published on crates.io, skipping."
            else
              echo "Publishing $crate v$ver to crates.io..."
              cargo publish -p "$crate"
            fi
          }

          # 1. Publish rustoku-lib first
          publish_crate "rustoku-lib"

          # 2. Wait for rustoku-lib to be indexed on crates.io so rustoku-cli dependency resolves
          lib_ver=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "rustoku-lib") | .version')
          for i in {1..6}; do
            indexed_ver=$(curl -s -H "User-Agent: rustoku-ci (samhuang91@gmail.com)" "https://crates.io/api/v1/crates/rustoku-lib/$lib_ver" | jq -r '.version.num // empty')
            if [ "$indexed_ver" = "$lib_ver" ]; then
              echo "rustoku-lib v$lib_ver is confirmed indexed on crates.io."
              break
            fi
            echo "Waiting for rustoku-lib v$lib_ver index propagation (attempt $i/6)..."
            sleep 5
          done

          # 3. Publish rustoku-cli
          publish_crate "rustoku-cli"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
